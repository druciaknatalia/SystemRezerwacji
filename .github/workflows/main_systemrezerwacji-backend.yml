name: Build and deploy ASP.Net Core app to Azure Web App - systemrezerwacji-backend

on:
 push:
   branches:
     - main
 workflow_dispatch:

env:
 AZURE_WEBAPP_NAME: systemrezerwacji-backend
 AZURE_WEBAPP_PACKAGE_PATH: backend/CloudBackend.Api/publish
 DOTNET_VERSION: '9.0.x'

jobs:
 build:
   runs-on: ubuntu-latest

   steps:
     - uses: actions/checkout@v4

     - name: Set up .NET Core
       uses: actions/setup-dotnet@v4
       with:
         dotnet-version: ${{ env.DOTNET_VERSION }}

     - name: Restore
       run: dotnet restore backend/CloudBackend.Api/CloudBackend.Api.csproj

     - name: Build
       run: dotnet build backend/CloudBackend.Api/CloudBackend.Api.csproj --configuration Release --no-restore

     - name: Publish
       run: dotnet publish backend/CloudBackend.Api/CloudBackend.Api.csproj -c Release -o ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

     - name: Upload artifact for deployment job
       uses: actions/upload-artifact@v4
       with:
         name: .net-app
         path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

 deploy:
   runs-on: ubuntu-latest
   needs: build
   environment:
     name: Production
     url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

   steps:
     - name: Download artifact from build job
       uses: actions/download-artifact@v4
       with:
         name: .net-app

     - name: Deploy to Azure Web App
       id: deploy-to-webapp
       uses: azure/webapps-deploy@v3
       with:
         app-name: ${{ env.AZURE_WEBAPP_NAME }}
         package: .
